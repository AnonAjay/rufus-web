<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" fill="none">
  <defs>
    <linearGradient id="webBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="capsuleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.95)" />
      <stop offset="100%" stop-color="rgba(30, 41, 59, 0.95)" />
    </linearGradient>
    <filter id="cyanGlowWeb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#webBgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Cyber Dot Accents -->
  <g opacity="0.12" fill="#00e5ff">
    <circle cx="50" cy="40" r="1.5" /><circle cx="70" cy="40" r="1.5" /><circle cx="90" cy="40" r="1.5" />
    <circle cx="50" cy="60" r="1.5" /><circle cx="70" cy="60" r="1.5" /><circle cx="90" cy="60" r="1.5" />
    <circle cx="830" cy="180" r="1.5" /><circle cx="850" cy="180" r="1.5" /><circle cx="870" cy="180" r="1.5" />
    <circle cx="830" cy="200" r="1.5" /><circle cx="850" cy="200" r="1.5" /><circle cx="870" cy="200" r="1.5" />
  </g>

  <!-- Visual Mockup: The Dynamic Island Capsule ("Hoverman") -->
  <g transform="translate(60, 52)">
    <!-- Main Capsule Pill -->
    <rect x="0" y="0" width="240" height="54" rx="27" fill="url(#capsuleGrad)" stroke="#00e5ff" stroke-width="1.6" filter="url(#cyanGlowWeb)" />
    
    <!-- Mini OLED Eyes inside Capsule -->
    <rect x="24" y="16" width="9" height="22" rx="4" fill="#00e5ff" filter="url(#cyanGlowWeb)" />
    <rect x="38" y="16" width="9" height="22" rx="4" fill="#00e5ff" filter="url(#cyanGlowWeb)" />

    <!-- Divider -->
    <line x1="58" y1="14" x2="58" y2="40" stroke="#334155" stroke-width="1.2" />

    <!-- Live Audio Waveform Bars (Wispr Flow) -->
    <g transform="translate(70, 27)" fill="#38bdf8">
      <rect x="0" y="-8" width="3" height="16" rx="1.5">
        <animate attributeName="height" values="16;6;22;16" dur="0.9s" repeatCount="indefinite" />
        <animate attributeName="y" values="-8;-3;-11;-8" dur="0.9s" repeatCount="indefinite" />
      </rect>
      <rect x="7" y="-12" width="3" height="24" rx="1.5">
        <animate attributeName="height" values="24;14;8;24" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="-12;-7;-4;-12" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="14" y="-14" width="3" height="28" rx="1.5">
        <animate attributeName="height" values="28;18;10;28" dur="0.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="-14;-9;-5;-14" dur="0.8s" repeatCount="indefinite" />
      </rect>
      <rect x="21" y="-9" width="3" height="18" rx="1.5">
        <animate attributeName="height" values="18;24;6;18" dur="1.0s" repeatCount="indefinite" />
        <animate attributeName="y" values="-9;-12;-3;-9" dur="1.0s" repeatCount="indefinite" />
      </rect>
      <rect x="28" y="-13" width="3" height="26" rx="1.5">
        <animate attributeName="height" values="26;10;20;26" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="-13;-5;-10;-13" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="35" y="-7" width="3" height="14" rx="1.5">
        <animate attributeName="height" values="14;20;6;14" dur="0.85s" repeatCount="indefinite" />
        <animate attributeName="y" values="-7;-10;-3;-7" dur="0.85s" repeatCount="indefinite" />
      </rect>
      <rect x="42" y="-11" width="3" height="22" rx="1.5">
        <animate attributeName="height" values="22;8;16;22" dur="1.05s" repeatCount="indefinite" />
        <animate attributeName="y" values="-11;-4;-8;-11" dur="1.05s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Circular Submit Button -->
    <circle cx="198" cy="27" r="14" fill="#00e5ff" />
    <path d="M193 27 L197 31 L204 22" stroke="#080a12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Typography & Headings -->
  <g transform="translate(340, 68)">
    <rect x="0" y="0" width="220" height="22" rx="5" fill="rgba(0, 229, 255, 0.12)" stroke="rgba(0, 229, 255, 0.3)" />
    <text x="10" y="15" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TAURI V2 • REACT 19</text>

    <!-- Main Title -->
    <text x="0" y="56" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">RUFUS DESKTOP &amp; ISLAND</text>

    <!-- Subtitle -->
    <text x="0" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500">
      Native Rust Shell • Floating Dynamic Island • Push-to-Talk • Robot Companion Workstation
    </text>
  </g>

  <!-- Badges Cluster -->
  <g transform="translate(60, 182)">
    <rect x="0" y="0" width="100" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="50" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Tauri v2</text>

    <rect x="108" y="0" width="102" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="159" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">React 19</text>

    <rect x="218" y="0" width="112" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="274" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="338" y="0" width="154" height="26" rx="6" fill="#0f172a" stroke="#00e5ff" stroke-width="1.2" />
    <text x="415" y="17" fill="#00e5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Dynamic Island (Hoverman)</text>

    <rect x="500" y="0" width="118" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="559" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Web Audio API</text>

    <rect x="626" y="0" width="138" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="695" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Multi-Window IPC</text>
  </g>
</svg>
